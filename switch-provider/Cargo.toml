[package]
name = "switch-provider"
version = "1.0.4"
authors = ["Danubio Lagoa"]
edition = "2021"
license = "MIT"
description = "Manage multiple LLM providers for Claude Code - GUI built in Rust with Slint"
repository = "https://github.com/danubiolagoa/switch-provider"

[dependencies]
# GUI framework
slint = "1.12"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File paths
dirs = "5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[build-dependencies]
slint-build = "1.12"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
